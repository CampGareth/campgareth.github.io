---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
    {%- if page.categories.size > 0 %} &middot; {{ page.categories | join: ", " }}{% endif -%}
  </p>
  {{ content }}
  <p class="post-back"><a href="{{ '/' | relative_url }}">&larr; back to the log</a></p>
</article>
