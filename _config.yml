title: Max Siegieda
description: >-
  Product reviews, cloud infrastructure notes, and the occasional musing about
  work — a plain-text log by Max Siegieda (CampGareth).
author: Max Siegieda
email: maxsiegieda@gmail.com
url: "https://campgareth.co.uk"
github_username: CampGareth

# Posts live under /log/ to mirror the xnux.eu/log style.
permalink: /log/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Show newest posts first anywhere we don't override ordering.
# (kramdown + rouge are Jekyll defaults; left implicit.)

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - infra
  - vendor
